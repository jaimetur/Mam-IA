services:
  mam-ia:
    image: ${APP_IMAGE_DEV}
    container_name: ${CONTAINER_NAME}-dev
    restart: ${RESTART_POLICY}
    ports:
      - "${APP_PORT_DEV}:${CONTAINER_PORT}"
    network_mode: bridge
    environment:
      TZ: ${TZ}
      APP_ENV: development
    volumes:
      - ${APP_SOURCE_DIR}:/usr/share/nginx/html:ro
      - ${APP_CONFIG_DIR}:/app/config
      - ${APP_DATA_DIR}:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:${CONTAINER_PORT}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
