name: 🤖 Android app

# Builds the Mam-IA Android app (the web app in a native shell, with exact reminders and "Share with Mam-IA").
# - On every change in android/ it refreshes the rolling "android-latest" pre-release (the APK for direct download and
#   the AAB for Google Play), from where tools/deploy-android.sh puts the APK on the server
#   (<DATA_DIR>/android/mamia-android.apk, served at /android.apk; /api/android says whether it is there).
# - Called by a release workflow with a release tag, it attaches the APK to that version's release instead.
# - On a release branch (X.Y.Z), it also uploads the AAB to Google Play (tools/play_publish.py), to the track of the
#   repository variable PLAY_TRACK (by default alpha, the closed test), with the release notes of the version's block
#   in CHANGELOG.md, when the secret PLAY_SERVICE_ACCOUNT_JSON is there. Play shows the release's version
#   (versionName = X.Y.Z, set by tools/CreateUpdateRelease.py) and the build number (versionCode). A new release branch
#   changes android/app/build.gradle.kts, so it always builds and uploads. It runs last: a Play error leaves the job red
#   but the APK is already published. When the version reaches main, release.yml takes this build to production.
on:
  push:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
    paths: ["android/**", ".github/workflows/android.yml", "tools/play_publish.py"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: "Release (vX.Y.Z) to attach the APK to"
        type: string
        required: true

concurrency:
  group: mamia-android-${{ github.ref }}-${{ inputs.release_tag || 'rolling' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Signing key (if the keystore is in the secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mamia.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/mamia.jks" >> "$GITHUB_ENV"; fi
      - name: Build
        working-directory: android
        env:
          MAMIA_ANDROID_BUILD: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease   # the APK (direct download) and the AAB (Google Play)
      - name: Signature
        run: |
          # the SHA-256 of the signing certificate: always the same once the keystore is in the secrets
          # (tools/android-keystore.sh); without it each build has a new debug key and can't install over the last one
          # apksigner reads the v2/v3 signatures of modern APKs (keytool -printcert only sees the old v1 one)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA=$("$SIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)
          [ -n "$ANDROID_KEYSTORE_FILE" ] && KIND="release key" || KIND="DEBUG key (no keystore in the secrets)"
          echo "SIGNATURE=$KIND · SHA-256 $SHA" >> "$GITHUB_ENV"
          echo "::notice title=Android signature::$KIND · SHA-256 $SHA"
      - name: Publish to the rolling android-latest pre-release
        if: ${{ !inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk mamia-android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab mamia-android.aab
          TITLE="Android app (rolling build)"
          NOTES="Latest APK of the Mam-IA Android app, rebuilt on every change in android/. It is a rolling build (hence a pre-release); each version's APK is attached to its own vX.Y.Z release."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create android-latest --prerelease --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload android-latest mamia-android.apk mamia-android.aab --clobber
          printf 'build %s · %s\n%s\n' "${{ github.run_number }}" "${GITHUB_SHA::7}" "$SIGNATURE" > android-build.txt
          gh release upload android-latest android-build.txt --clobber
      - name: Upload to Google Play (release branches)
        if: ${{ !inputs.release_tag }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Not a release branch: not uploaded to Google Play."; exit 0; fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "::warning title=Google Play::No PLAY_SERVICE_ACCOUNT_JSON secret: the AAB was not uploaded to Google Play."; exit 0; fi
          VERSION=$(sed -n 's/^ *versionName *= *"\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then echo "::error title=Google Play::versionName $VERSION is not the release $GITHUB_REF_NAME (run tools/CreateUpdateRelease.py --update)"; exit 1; fi
          pip install -q requests==2.32.3 cryptography==44.0.0
          python tools/play_publish.py --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track "$PLAY_TRACK" --release-name "$VERSION (${{ github.run_number }})" --version "$VERSION"
          echo "::notice title=Google Play::$VERSION (${{ github.run_number }}) uploaded to the $PLAY_TRACK track"
      - name: Attach to the version release
        if: ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${{ inputs.release_tag }}"
          cp android/app/build/outputs/apk/release/app-release.apk "mamia-android-$T.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "mamia-android-$T.aab"
          gh release upload "$T" "mamia-android-$T.apk" "mamia-android-$T.aab" --clobber
