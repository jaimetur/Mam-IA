name: 📸 Google Play images

# Regenerates the Google Play store images (screenshots for phone, tablet and Chromebook, and the feature graphic) in
# every language of the app whenever the interface, its translations or the demo family change, and commits them to
# assets/play-store/<Play language code>/ of the same release branch (X.Y.Z; see tools/play_screenshots.py). Not on
# main: main only gets a finished release branch pushed onto it, and a commit of its own there would stop the next
# push of the release branch to main (non-fast-forward). On a release branch it then uploads them, with the texts of the listing, to Google Play
# (tools/play_publish.py) when the secret PLAY_SERVICE_ACCOUNT_JSON is there. Its own commits are [skip ci].
on:
  push:
    branches: ["[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "src/frontend/**"
      - "lang/**"
      - "src/backend/app/demo/**"
      - "assets/branding/**"
      - "tools/play_screenshots.py"
      - "tools/play_publish.py"
      - "assets/play-store/**"
      - ".github/workflows/play_screenshots.yml"
  workflow_dispatch:

concurrency:
  group: mamia-play-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependencies, Chromium and fonts for Chinese and Japanese
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-cjk fonts-noto-color-emoji
      - name: Make the images
        run: python tools/play_screenshots.py
      - name: Commit them if they changed
        run: |
          git add assets/play-store
          if git diff --cached --quiet; then echo "The images did not change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Google Play images regenerated from ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload the listing to Google Play (release branches)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Not a release branch: the listing was not uploaded."; exit 0; fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "::warning title=Google Play::No PLAY_SERVICE_ACCOUNT_JSON secret: the listing was not uploaded to Google Play."; exit 0; fi
          python tools/play_publish.py --listing
