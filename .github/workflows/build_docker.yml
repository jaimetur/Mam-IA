name: Tests and Docker image

# Every push runs the tests. The image jaimetur/mam-ia is built and pushed for:
#   - main → :main
#   - a version branch (X.Y.Z, made by tools/CreateUpdateRelease.py) → :X.Y.Z and :latest (what the NAS runs)
#   - a tag vX.Y.Z → :X.Y.Z
# It can also be run by hand (Actions → Run workflow).
on:
  push:
    branches: [main, "[0-9]+.[0-9]+.[0-9]+"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mamia-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Server tests
        run: |
          pip install -e ".[test]"
          python -m pytest -q
      - name: Web app tests
        run: TZ=Europe/Madrid node --test tests/frontend/*.test.mjs

  docker:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: image
        shell: bash
        run: |
          IMAGE=jaimetur/mam-ia
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo "${IMAGE}:${GITHUB_REF_NAME#v}"; fi
            if [[ "${GITHUB_REF}" == refs/heads/main ]]; then echo "${IMAGE}:main"; fi
            if [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "${IMAGE}:${GITHUB_REF_NAME}"; echo "${IMAGE}:latest"; fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # the repository's secret keeps its original name (DOCHERHUB_USERNAME); DOCKERHUB_USERNAME also works
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCHERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
