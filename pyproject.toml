[project]
name = "mamia"
version = "0.2.0"
description = "Servidor de Mam-IA: la agenda compartida de toda la familia"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "argon2-cffi==23.1.0",
  "cryptography==44.0.0",
  "requests==2.32.3",
  "pywebpush==2.3.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "httpx==0.28.1",
]
dev = [
  "Pillow==13.0.0",
]

[tool.setuptools]
package-dir = {"" = "src/backend"}
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/backend"]
