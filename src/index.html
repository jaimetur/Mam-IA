<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f0678f">
  <meta name="description" content="Mam-IA: organización integral familiar para madres con agenda compartida y planificación inteligente.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/mam-ia-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Mam-IA | Organización Familiar</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app-shell">
    <header class="top-bar card">
      <div class="brand">
        <img src="./assets/mam-ia-logo.svg" alt="Logo Mam-IA" class="logo">
        <div>
          <h1>Mam-IA</h1>
          <p>Tu centro de mando familiar</p>
        </div>
      </div>
      <div class="theme-tools">
        <label for="theme-picker">Tema</label>
        <select id="theme-picker" aria-label="Selecciona tema de color"></select>
      </div>
    </header>

    <main class="layout">
      <nav id="module-grid" class="module-grid" aria-label="Módulos principales"></nav>

      <section id="module-view" class="module-view card" aria-live="polite">
        <h2 id="module-title"></h2>
        <p id="module-description"></p>
        <div id="module-content" class="module-content"></div>
      </section>
    </main>

    <aside class="quick-panels">
      <section class="card panel">
        <h3>Resumen del día</h3>
        <ul id="daily-summary" class="summary-list"></ul>
      </section>
      <section class="card panel">
        <h3>Invitaciones familiares</h3>
        <form id="invite-form" class="invite-form">
          <input type="text" id="invite-name" placeholder="Nombre del miembro" required>
          <input type="email" id="invite-email" placeholder="Email" required>
          <button type="submit" class="btn-primary">Enviar invitación</button>
        </form>
        <ul id="invite-list" class="invite-list"></ul>
      </section>
    </aside>
  </div>

  <script src="./app.js"></script>
</body>
</html>
